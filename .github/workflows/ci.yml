name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest + cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes com cobertura
        run: |
          pytest --cov=app --cov-report=term-missing \
                 --cov-report=html --cov-report=xml \
                 --cov-fail-under=70 | tee coverage.txt

      - name: Publicar resumo de cobertura (backend)
        if: always()
        run: |
          {
            echo "## Cobertura — Backend (pytest)"
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exportar evidência de cobertura (backend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: |
            src/backend/htmlcov/
            src/backend/coverage.xml
          retention-days: 90

  frontend:
    name: Frontend — Vitest + cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes com cobertura
        run: npx vitest run --coverage --coverage.thresholds.statements=70 | tee coverage.txt

      - name: Publicar resumo de cobertura (frontend)
        if: always()
        run: |
          {
            echo "## Cobertura — Frontend (Vitest)"
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exportar evidência de cobertura (frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: src/frontend/coverage/
          retention-days: 90

  e2e:
    name: Frontend — Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install chromium --with-deps

      - name: Rodar testes E2E
        run: npm run e2e

      - name: Exportar evidência E2E (Playwright)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: src/frontend/playwright-report/
          retention-days: 90
